<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⁺‧₊☽◯☾₊‧⁺</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #4a0f8d;
            --card-bg: #020202;
            --text-color: #ffffff;
            --primary-color: #8257e5;
            --border-color: #e3e3ec;
            --submenu-bg: #faf5f5;
            
            --active-bg: rgb(221, 18, 177);
            --active-text: black;
            --hover-bg: yellow;
            --hover-text: black;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 1400px;
            display: grid;
            grid-template-columns: 1fr 380px;
            gap: 20px;
        }

        @media (max-width: 1000px) {
            .container { grid-template-columns: 1fr; }
        }

        h1 { 
            margin-top: 0; 
            font-family: 'Caveat', cursive; 
            font-size: 3.5rem; 
            color: rgb(221, 18, 177); 
            font-weight: bold; 
            text-align: center;
        }
        
        h3 { margin-top: 0; color: #fff; }

        .panel {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
        }

        .form-group { margin-bottom: 15px; }
        .form-row { display: flex; gap: 10px; align-items: flex-end;}
        .form-row .form-group { flex: 1; margin-bottom: 0;}

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            font-size: 14px;
            color: #a8a8b3;
        }

        input[type="text"], input[type="number"], select, textarea {
            width: 100%;
            padding: 12px;
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            color: var(--text-color);
            box-sizing: border-box;
            font-size: 15px;
        }

        select optgroup {
            background-color: #202024;
            color: var(--text-color);
            font-weight: bold;
            font-style: normal;
        }

        textarea { resize: vertical; min-height: 200px; font-family: monospace; font-size: 13px; }

        .tabs {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 15px;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 15px;
        }

        .tab-btn, .sub-btn, .tab-cat-btn {
            background: #202024;
            border: 1px solid var(--border-color);
            color: #7c7c8a;
            padding: 10px 20px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
            border-radius: 4px;
            transition: all 0.2s;
        }

        .sub-btn { padding: 6px 12px; font-size: 13px; }

        .tab-btn.active, .sub-btn.active, .tab-cat-btn.active {
            background-color: var(--active-bg) !important;
            color: var(--active-text) !important;
            border-color: var(--active-bg) !important;
        }

        .tab-btn:hover, .sub-btn:hover, .tab-cat-btn:hover, .card-btn:hover {
            background-color: var(--hover-bg) !important;
            color: var(--hover-text) !important;
            border-color: var(--hover-bg) !important;
        }

        .submenus {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            background-color: var(--submenu-bg);
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 15px;
            border: 1px solid var(--border-color);
        }

        /* ESTILO DOS MODIFICADORES */
        .modifiers-box {
            display: flex;
            gap: 20px;
            background: #202024;
            padding: 12px;
            border-radius: 6px;
            border: 1px dashed var(--active-bg);
            margin-bottom: 15px;
            align-items: center;
        }
        
        .modifiers-box label {
            margin: 0;
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            color: #fff;
            font-size: 15px;
        }

        .modifiers-box input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: var(--active-bg);
        }

        .keyboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 8px;
            max-height: 400px;
            overflow-y: auto;
            padding-right: 5px;
            background: var(--bg-color);
            padding: 10px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
        }

        .card-btn {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 10px 4px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            text-align: center;
            transition: all 0.15s;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 50px;
        }

        .positions-tracker {
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 15px;
            margin-top: 15px;
        }

        .position-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px solid #202024;
            font-size: 14px;
        }

        .position-item:last-child { border-bottom: none; }
        .pos-title { color: #ffffff; font-weight: 500; }
        .pos-value { color: var(--active-bg); font-weight: bold; }

        .output-box {
            position: sticky;
            top: 20px;
            height: fit-content;
        }

        .btn-action {
            width: 100%;
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 4px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
            transition: background 0.2s;
        }

        .btn-start {
            background-color: var(--hover-bg);
            color: var(--hover-text);
        }

        .btn-action:hover { opacity: 0.9; }
        .btn-clear { background: none; border: 1px solid #7c7c8a; color: #7c7c8a; margin-top: 8px;}
        .btn-clear:hover { background-color: #c53030 !important; color: white !important; border-color: #c53030 !important;}

        .toast {
            visibility: hidden;
            min-width: 250px;
            background-color: var(--active-bg);
            color: black;
            text-align: center;
            border-radius: 4px;
            padding: 16px;
            position: fixed;
            z-index: 10;
            bottom: 30px;
            font-weight: bold;
            box-shadow: 0px 4px 10px rgba(0,0,0,0.3);
        }
        .toast.show { visibility: visible; animation: fadein 0.5s, fadeout 0.5s 2.5s; }
        @keyframes fadein { from {bottom: 0; opacity: 0;} to {bottom: 30px; opacity: 1;} }
        @keyframes fadeout { from {bottom: 30px; opacity: 1;} to {bottom: 0; opacity: 0;} }
    </style>
</head>
<body>

    <div class="container">
        
        <div class="panel">

            <div class="form-row">

                        <option value="Amor">Amor / Relacionamentos</option>
                        <option value="Trabalho">Trabalho / Dinheiro</option>

                    </select>
                </div>
            </div>

            <!-- 3º O Baralho -->
            <label>3º Selecione o Baralho</label>
            <div class="tabs">
                <button class="tab-btn active" id="btn-tab-cigano" onclick="mudarBaralho('cigano')">Baralho Cigano</button>

                <button class="tab-btn" id="btn-tab-chronos" onclick="mudarBaralho('chronos')">Chronos</button>
                <button class="tab-btn" id="btn-tab-sibila" onclick="mudarBaralho('sibila')">Sibila Italiana</button>
            </div>

            <div class="submenus" id="area-submenu" style="display: none;"></div>

            <!-- 4º Categoria de Método -->
            <label>4º Categoria de Método</label>
            <div class="tabs">
                <button class="tab-cat-btn active" id="btn-cat-sequencia" onclick="mudarCategoriaMetodo('sequencia')">Sequencia intuitiva</button>
                <button class="tab-cat-btn" id="btn-cat-simples" onclick="mudarCategoriaMetodo('simples')">Simples</button>
                <button class="tab-cat-btn" id="btn-cat-objetivas" onclick="mudarCategoriaMetodo('objetivas')">Objetivas</button>
                <button class="tab-cat-btn" id="btn-cat-mesas_complexas" onclick="mudarCategoriaMetodo('mesas_complexas')">Mesas Complexas</button>
                <button class="tab-cat-btn" id="btn-cat-avancadas" onclick="mudarCategoriaMetodo('avancadas')">Avançadas</button>
                <button class="tab-cat-btn" id="btn-cat-combos" onclick="mudarCategoriaMetodo('combos')">Combos</button>
            </div>

            <div class="form-row" style="margin-bottom: 15px;">
                <div class="form-group">
                    <label for="id-metodo">5º Método de Tiragem</label>
                    <select id="id-metodo" onchange="mudarMetodo()">
                        <!-- Preenchido via JavaScript -->
                    </select>
                </div>
                
                <div class="form-group" id="container-qtd-cartas" style="max-width: 120px; display: none;">
                    <label for="id-qtd-cartas">Qtd. Cartas</label>
                    <input type="number" id="id-qtd-cartas" min="1" max="15" value="3" onchange="configurarSequencial()">
                </div>
            </div>

                <label>
                    <input type="checkbox" id="chk-invertida"> 
                    Carta Invertida
                </label>
                <label>

                    Fundo de Deck

            </div>

            <div class="keyboard-grid" id="keyboard"></div>

            <div class="positions-tracker">
                <h3>Sequência Selecionada</h3>
                <div id="tracker-lista"></div>
            </div>
        </div>

            <h3>Prompt Estruturado</h3>
            <textarea id="output-prompt" readonly></textarea>
            
            <button class="btn-action btn-start" onclick="window.open('https://notebooklm.google.com/', '_blank')">Start</button>
            <button class="btn-action" onclick="copiarPrompt()">Copiar para o NotebookLM</button>
            <button class="btn-action btn-clear" onclick="limparSelecao()">Limpar Tudo</button>
        </div>

    </div>

                "c17": { nome: "17. Alinhamento Espiritual (6 cartas)", posicoes: gPos(6) },
                "c18": { nome: "18. Novos Rumos Profissionais (7 cartas)", posicoes: gPos(7) },
                "c19": { nome: "19. Leitura Energia Financeira (6 cartas)", posicoes: gPos(6) },
                "c20": { nome: "20. Tiragem Área Profissional (8 cartas)", posicoes: gPos(8) },
                "c21": { nome: "21. Tiragem do Empreendedor (6 cartas)", posicoes: gPos(6) },
                "c22": { nome: "22. Energia do Ambiente (6 cartas)", posicoes: gPos(6) },
                "c23": { nome: "23. Desfazendo as Confusões que Eu Invento (7 cartas)", posicoes: gPos(7) },
                "c24": { nome: "24. Estou Sob Efeito de Magia? (7 cartas)", posicoes: gPos(7) },
                "c25": { nome: "25. Tarô Diário (4 cartas)", posicoes: gPos(4) },
                "c26": { nome: "26. Tiragem para o Mês (7 cartas)", posicoes: gPos(7) },
                "c27": { nome: "27. Impactos da Minha Infância (8 cartas)", posicoes: gPos(8) },
                "c28": { nome: "28. Explorando o Outro (15 cartas)", posicoes: gPos(15) },
                "c29": { nome: "29. Confio na Pessoa? (4 cartas)", posicoes: gPos(4) },
                "c30": { nome: "30. Devo Tomar Essa Decisão...? (5 cartas)", posicoes: gPos(5) },
                "c31": { nome: "31. Desvendando o Outro (9 cartas)", posicoes: gPos(9) },
                "c32": { nome: "32. Renascendo em Mim (5 cartas)", posicoes: gPos(5) },
                "c33": { nome: "33. Análise de Sonhos (5 cartas)", posicoes: gPos(5) },
                "c34": { nome: "34. Próximos Capítulos Amor (6 cartas)", posicoes: gPos(6) },
                "c35": { nome: "35. Ficar ou Partir (6 cartas)", posicoes: gPos(6) },
                "c36": { nome: "36. Triângulo Amoroso (8 cartas)", posicoes: gPos(8) },
                "c37": { nome: "37. Chá de Sumiço (5 cartas)", posicoes: gPos(5) },
                "c38": { nome: "38. Aparência (4 cartas)", posicoes: gPos(4) },
                "c39": { nome: "39. Tiragem de Autoconhecimento: Eu (7 cartas)", posicoes: gPos(7) },
                "c40": { nome: "40. Método da Mentira (4 cartas)", posicoes: gPos(4) }
            }
        };

        let baralhoAtual = 'cigano';
        let subcategoriaAtual = '';
        let categoriaMetodoAtual = 'sequencia';
        let cartasSelecionadas = [];
        let listaPosicoesAtuais = [];

        function init() {
            mudarBaralho('cigano');
            mudarCategoriaMetodo('sequencia');
        }

        function mudarBaralho(nomeBaralho) {
            baralhoAtual = nomeBaralho;
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(`btn-tab-${nomeBaralho}`).classList.add('active');
            
            const b = estruturaBaralhos[baralhoAtual];
            subcategoriaAtual = b.subcategorias ? Object.keys(b.subcategorias)[0] : '';
            
            renderizarSubmenus();
            renderizarTeclado();
        }

        function mudarSubcategoria(nomeSub) {
            subcategoriaAtual = nomeSub;
            document.querySelectorAll('.sub-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            renderizarTeclado();
        }

        function mudarCategoriaMetodo(nomeCat) {
            categoriaMetodoAtual = nomeCat;
            document.querySelectorAll('.tab-cat-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(`btn-cat-${nomeCat}`).classList.add('active');

            const selectMetodo = document.getElementById('id-metodo');
            selectMetodo.innerHTML = '';
            
            const metodos = metodosPorCategoria[nomeCat];
            for (const [key, obj] of Object.entries(metodos)) {
                const option = document.createElement('option');
                option.value = key;
                option.innerText = obj.nome;
                selectMetodo.appendChild(option);
            }

            mudarMetodo();
        }

        function mudarMetodo() {
            const metodoSelecionado = document.getElementById('id-metodo').value;
            const containerQtd = document.getElementById('container-qtd-cartas');

            if (metodoSelecionado === 'sequencial') {
                containerQtd.style.display = 'block';
                configurarSequencial();
            } else {
                containerQtd.style.display = 'none';
                // Usamos o Spread operator [...] para não mutar a array original da configuração
                listaPosicoesAtuais = [...metodosPorCategoria[categoriaMetodoAtual][metodoSelecionado].posicoes];
                cartasSelecionadas = [];
                renderizarTracker();
                atualizarPrompt();
            }
        }

        function configurarSequencial() {
            const qtdInput = document.getElementById('id-qtd-cartas');
            let val = parseInt(qtdInput.value) || 3;
            if (val < 1) val = 1;
            if (val > 15) val = 15;
            qtdInput.value = val;

            listaPosicoesAtuais = gPos(val);
            cartasSelecionadas = [];
            renderizarTracker();
            atualizarPrompt();
        }

        function renderizarSubmenus() {
            const area = document.getElementById('area-submenu');
            const b = estruturaBaralhos[baralhoAtual];

            if (b.subcategorias) {
                area.style.display = 'flex';
                area.innerHTML = '';
                Object.keys(b.subcategorias).forEach(sub => {
                    const btn = document.createElement('button');
                    btn.className = `sub-btn ${sub === subcategoriaAtual ? 'active' : ''}`;
                    btn.innerText = sub;
                    btn.onclick = () => mudarSubcategoria(sub);
                    area.appendChild(btn);
                });
            } else {
                area.style.display = 'none';
            }
        }

        function renderizarTeclado() {
            const grid = document.getElementById('keyboard');
            grid.innerHTML = '';
            
            const b = estruturaBaralhos[baralhoAtual];
            let listaCartas = b.subcategorias ? b.subcategorias[subcategoriaAtual] : b.direto;

            listaCartas.forEach(carta => {
                const btn = document.createElement('button');
                btn.className = 'card-btn';
                btn.innerText = carta;
                btn.onclick = () => clicarCarta(carta);
                grid.appendChild(btn);
            });
        }

        function renderizarTracker() {
            const lista = document.getElementById('tracker-lista');
            lista.innerHTML = '';

            listaPosicoesAtuais.forEach((posicao, index) => {
                const item = document.createElement('div');
                item.className = 'position-item';
                
                const cartaAlocada = cartasSelecionadas[index] || "Aguardando clique...";
                const estiloCarta = cartasSelecionadas[index] ? 'pos-value' : 'pos-title';

                item.innerHTML = `
                    <span class="pos-title">${posicao}:</span>
                    <span class="${estiloCarta}">${cartaAlocada}</span>
                `;
                lista.appendChild(item);
            });
        }

        // --- LÓGICA CORE C/ MODIFICADORES INTELIGENTES ---
        function clicarCarta(nomeCarta) {
            const chkInvertida = document.getElementById('chk-invertida');
            const chkFundo = document.getElementById('chk-fundo');
            
            // Bypass para o Fundo de Deck (cria uma posição extra caso a matriz já esteja cheia)
            if (chkFundo.checked && cartasSelecionadas.length >= listaPosicoesAtuais.length) {
                listaPosicoesAtuais.push("Fundo de Deck / Extra");
            }

            if (cartasSelecionadas.length < listaPosicoesAtuais.length) {
                const identificadorDeBaralho = baralhoAtual.toUpperCase();
                
                let modificador = "";
                if (chkInvertida.checked) modificador += " (INVERTIDA)";
                if (chkFundo.checked) modificador += " (FUNDO DE DECK)";
                
                cartasSelecionadas.push(`${nomeCarta} (${identificadorDeBaralho})${modificador}`);
                
                // UX Safety: Desmarca as opções após o clique
                chkInvertida.checked = false;
                chkFundo.checked = false;

                renderizarTracker();
                atualizarPrompt();
            } else {
                alert("Todas as posições configuradas para este método já foram preenchidas!");
            }
        }

        function limparSelecao() {
            // Se o usuário adicionou Fundo de Deck extras, resetamos a lista de posições
            const metodoSelecionado = document.getElementById('id-metodo').value;
            if (metodoSelecionado !== 'sequencial') {
                listaPosicoesAtuais = [...metodosPorCategoria[categoriaMetodoAtual][metodoSelecionado].posicoes];
            } else {
                let val = parseInt(document.getElementById('id-qtd-cartas').value) || 3;
                listaPosicoesAtuais = gPos(val);
            }
            
            cartasSelecionadas = [];
            renderizarTracker();
            atualizarPrompt();
        }

        function atualizarPrompt() {
            const pergunta = document.getElementById('id-pergunta').value || "[Não informada]";
            const metodoSelect = document.getElementById('id-metodo');
            const nomeMetodo = metodoSelect.options[metodoSelect.selectedIndex].text;
            
            // Puxando o valor do Tema selecionado
            const selectTema = document.getElementById('id-tema');
            const nomeTema = selectTema.options[selectTema.selectedIndex].value;

            let prompt = `Analise a seguinte consulta oracular estruturada. Para decodificar a dinâmica das posições e as regras específicas desta tiragem, consulte o seu documento interno de referência de MÉTODOS.\n\n`;
            
            // Diretriz inquebrável inserida no topo
            prompt += `[DIRETRIZ DE BUSCA]: Esta consulta é sobre ${nomeTema.toUpperCase()}. Priorize exclusivamente os significados das cartas presentes no seu documento de Fontes sobre ${nomeTema}.\n\n`;

            prompt += `[DADOS DA CONSULTA]\n`;
            prompt += `* Pergunta formulada: "${pergunta}"\n`;
            prompt += `* Método estrutural: ${nomeMetodo}\n\n`;
            prompt += `[CARTAS EXTRAÍDAS E POSIÇÕES]\n`;

            listaPosicoesAtuais.forEach((posicao, index) => {
                const carta = cartasSelecionadas[index] || "[Pendente]";
                prompt += `  - ${posicao} -> ${carta}\n`;
            });

            prompt += `\n[INSTRUÇÕES RIGOROSAS PARA O PROMPT]\n`;
            prompt += `1. Acesse sua fonte de métodos e localize as regras e a semântica exata para o método.\n`;
            prompt += `2. Aplique o significado técnico de cada carta de acordo com os manuais de baralho em anexo, adaptando-os à função de cada posição determinada.\n`;
            prompt += `3. Costure uma resposta direta, clara e preditiva/analítica para a pergunta do consulente, respeitando estritamente os fatos textuais das fontes.`;

            document.getElementById('output-prompt').value = prompt;
        }

        function copiarPrompt() {
            const areaTexto = document.getElementById('output-prompt');
            areaTexto.select();
            navigator.clipboard.writeText(areaTexto.value).then(() => {
                const toast = document.getElementById("toast");
                toast.className = "toast show";
                setTimeout(() => { toast.className = toast.className.replace("show", ""); }, 3000);
            });
        }

        window.onload = init;
    </script>
</body>
</html>
