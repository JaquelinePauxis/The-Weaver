<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⁺‧₊☽◯☾₊‧⁺</title>
    
    <!-- Fonte Caveat solicitada -->
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #4a0f8d;
            --card-bg: #020202;
            --text-color: #ffffff;
            --primary-color: #8257e5;
            --border-color: #e3e3ec;
            --submenu-bg: #faf5f5;
            
            /* Novas Cores Baseadas no Documento */
            --active-bg: rgb(221, 18, 177);
            --active-text: black;
            --hover-bg: yellow;
            --hover-text: black;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 1400px;
            display: grid;
            grid-template-columns: 1fr 380px;
            gap: 20px;
        }

        @media (max-width: 1000px) {
            .container { grid-template-columns: 1fr; }
        }

        /* Estilização do Título A Tecelã */
        h1 { 
            margin-top: 0; 
            font-family: 'Caveat', cursive; 
            font-size: 3.5rem; 
            color: rgb(221, 18, 177); 
            font-weight: bold; 
            text-align: center;
        }
        
        h3 { margin-top: 0; color: #fff; }

        .panel {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
        }

        .form-group { margin-bottom: 15px; }
        .form-row { display: flex; gap: 10px; align-items: flex-end;}
        .form-row .form-group { flex: 1; margin-bottom: 0;}

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            font-size: 14px;
            color: #a8a8b3;
        }

        input[type="text"], input[type="number"], select, textarea {
            width: 100%;
            padding: 12px;
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            color: var(--text-color);
            box-sizing: border-box;
            font-size: 15px;
        }

        select optgroup {
            background-color: #202024;
            color: var(--text-color);
            font-weight: bold;
        }

        textarea { resize: vertical; min-height: 200px; font-family: monospace; font-size: 13px; }

        /* ABAS PRINCIPAIS */
        .tabs {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 15px;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 15px;
        }

        .tab-btn, .sub-btn {
            background: #202024;
            border: 1px solid var(--border-color);
            color: #7c7c8a;
            padding: 10px 20px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
            border-radius: 4px;
            transition: all 0.2s;
        }

        .sub-btn { padding: 6px 12px; font-size: 13px; }

        /* EFEITOS SOLICITADOS (ACTIVE E HOVER) */
        .tab-btn.active, .sub-btn.active {
            background-color: var(--active-bg) !important;
            color: var(--active-text) !important;
            border-color: var(--active-bg) !important;
        }

        .tab-btn:hover, .sub-btn:hover, .card-btn:hover {
            background-color: var(--hover-bg) !important;
            color: var(--hover-text) !important;
            border-color: var(--hover-bg) !important;
        }

        /* SUBMENUS DINÂMICOS */
        .submenus {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            background-color: var(--submenu-bg);
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 15px;
            border: 1px solid var(--border-color);
        }

        /* GRIDS DO TECLADO */
        .keyboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 8px;
            max-height: 400px;
            overflow-y: auto;
            padding-right: 5px;
            background: var(--bg-color);
            padding: 10px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
        }

        .card-btn {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 10px 4px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            text-align: center;
            transition: all 0.15s;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 50px;
        }

        /* TRACKER DE POSIÇÕES */
        .positions-tracker {
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 15px;
            margin-top: 15px;
        }

        .position-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px solid #202024;
            font-size: 14px;
        }

        .position-item:last-child { border-bottom: none; }
        .pos-title { color: #ffffff; font-weight: 500; }
        .pos-value { color: var(--active-bg); font-weight: bold; }

        /* OUTPUT FIXO */
        .output-box {
            position: sticky;
            top: 20px;
            height: fit-content;
        }

        .btn-action {
            width: 100%;
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 4px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
            transition: background 0.2s;
        }

        .btn-start {
            background-color: var(--hover-bg);
            color: var(--hover-text);
        }

        .btn-action:hover { opacity: 0.9; }
        .btn-clear { background: none; border: 1px solid #7c7c8a; color: #7c7c8a; margin-top: 8px;}
        .btn-clear:hover { background-color: #c53030 !important; color: white !important; border-color: #c53030 !important;}

        .toast {
            visibility: hidden;
            min-width: 250px;
            background-color: pink;
            color: black;
            text-align: center;
            border-radius: 4px;
            padding: 16px;
            position: fixed;
            z-index: 10;
            bottom: 30px;
            font-weight: bold;
            box-shadow: 0px 4px 10px rgba(0,0,0,0.3);
        }

        .toast.show { visibility: visible; animation: fadein 0.5s, fadeout 0.5s 2.5s; }

        @keyframes fadein { from {bottom: 0; opacity: 0;} to {bottom: 30px; opacity: 1;} }
        @keyframes fadeout { from {bottom: 30px; opacity: 1;} to {bottom: 0; opacity: 0;} }
    </style>
</head>
<body>

    <div class="container">
        
        <!-- PAINEL ESQUERDO: SELEÇÃO (Fluxo ajustado: Pergunta > Baralho > Método) -->

            </div>

            <!-- 2º O Baralho -->

            <div class="tabs">
                <button class="tab-btn active" id="btn-tab-cigano" onclick="mudarBaralho('cigano')">Baralho Cigano</button>
                <button class="tab-btn" id="btn-tab-tarot" onclick="mudarBaralho('tarot')">Tarot</button>
                <button class="tab-btn" id="btn-tab-padilha" onclick="mudarBaralho('padilha')">Maria Padilha</button>
                <button class="tab-btn" id="btn-tab-chronos" onclick="mudarBaralho('chronos')">Chronos</button>
                <button class="tab-btn" id="btn-tab-sibila" onclick="mudarBaralho('sibila')">Sibila Italiana</button>
            </div>

            <!-- Submenu Dinâmico -->
            <div class="submenus" id="area-submenu" style="display: none;"></div>

            <!-- 3º O Método -->
            <div class="form-row" style="margin-bottom: 15px;">
                <div class="form-group">
                    <label for="id-metodo">3º Método de Tiragem</label>
                    <select id="id-metodo" onchange="mudarMetodo()">

                    </select>
                </div>
                
                <div class="form-group" id="container-qtd-cartas" style="max-width: 120px; display: none;">

                    <input type="number" id="id-qtd-cartas" min="1" max="15" value="3" onchange="configurarSequencial()">

            </div>

            <!-- Espaço do Teclado Virtual -->
            <div class="keyboard-grid" id="keyboard"></div>

            <!-- Monitor de Cliques -->
            <div class="positions-tracker">
                <h3>Sequência Selecionada</h3>
                <div id="tracker-lista"></div>
            </div>
        </div>

        <!-- PAINEL DIREITO: OUTPUT E AÇÕES -->
        <div class="panel output-box">
            <h3>Prompt Estruturado</h3>
            <textarea id="output-prompt" readonly></textarea>
            
            <!-- Botões -->
            <button class="btn-action btn-start" onclick="window.open('https://notebooklm.google.com/', '_blank')">Start</button>
            <button class="btn-action" onclick="copiarPrompt()">Copiar para o NotebookLM</button>
            <button class="btn-action btn-clear" onclick="limparSelecao()">Limpar Tudo</button>
        </div>

    </div>

        // --- ALTERNADORES ---
        function mudarBaralho(nomeBaralho) {

        function popularMetodos(nomeBaralho) {
            const selectMetodo = document.getElementById('id-metodo');
            selectMetodo.innerHTML = ''; // Limpa os métodos

                    optgroup += `<option value="${idVal}">${nome} (${posicoes.length} cartas)</option>`;

                selectMetodo.innerHTML += optgroup;
            }

            mudarMetodo(); // Atualiza a tela com o método sequencial padrão
        }

                configurarSequencial();
            } else {
                containerQtd.style.display = 'none';
                listaPosicoesAtuais = configuracaoDeMetodosAtuais[metodoSelecionado];
                cartasSelecionadas = [];
                renderizarTracker();
                atualizarPrompt();
            }
        }

        function configurarSequencial() {
            const qtdInput = document.getElementById('id-qtd-cartas');
            let val = parseInt(qtdInput.value) || 3;
            if (val < 1) val = 1;
            if (val > 15) val = 15;
            qtdInput.value = val;

            listaPosicoesAtuais = gPos(val);
            cartasSelecionadas = [];
            renderizarTracker();
            atualizarPrompt();
        }

        // --- RENDERIZADORES ---
        function renderizarSubmenus() {
            const area = document.getElementById('area-submenu');
            const b = estruturaBaralhos[baralhoAtual];

            if (b.subcategorias) {
                area.style.display = 'flex';
                area.innerHTML = '';
                Object.keys(b.subcategorias).forEach(sub => {
                    const btn = document.createElement('button');
                    btn.className = `sub-btn ${sub === subcategoriaAtual ? 'active' : ''}`;
                    btn.innerText = sub;
                    btn.onclick = () => mudarSubcategoria(sub);
                    area.appendChild(btn);
                });
            } else {
                area.style.display = 'none';
            }
        }

        function renderizarTeclado() {
            const grid = document.getElementById('keyboard');
            grid.innerHTML = '';
            
            const b = estruturaBaralhos[baralhoAtual];
            let listaCartas = b.subcategorias ? b.subcategorias[subcategoriaAtual] : b.direto;

            listaCartas.forEach(carta => {
                const btn = document.createElement('button');
                btn.className = 'card-btn';
                btn.innerText = carta;
                btn.onclick = () => clicarCarta(carta);
                grid.appendChild(btn);
            });
        }

        function renderizarTracker() {
            const lista = document.getElementById('tracker-lista');
            lista.innerHTML = '';

            listaPosicoesAtuais.forEach((posicao, index) => {
                const item = document.createElement('div');
                item.className = 'position-item';
                
                const cartaAlocada = cartasSelecionadas[index] || "Aguardando clique...";
                const estiloCarta = cartasSelecionadas[index] ? 'pos-value' : 'pos-title';

                item.innerHTML = `
                    <span class="pos-title">${posicao}:</span>
                    <span class="${estiloCarta}">${cartaAlocada}</span>
                `;
                lista.appendChild(item);
            });
        }

        // --- LÓGICA CORE ---
        function clicarCarta(nomeCarta) {
            if (cartasSelecionadas.length < listaPosicoesAtuais.length) {
                const identificadorDeBaralho = baralhoAtual.toUpperCase();
                cartasSelecionadas.push(`${nomeCarta} (${identificadorDeBaralho})`);
                renderizarTracker();
                atualizarPrompt();
            } else {
                alert("Todas as posições configuradas para este método já foram preenchidas!");
            }
        }

        function limparSelecao() {
            cartasSelecionadas = [];
            renderizarTracker();
            atualizarPrompt();
        }

        function atualizarPrompt() {
            const pergunta = document.getElementById('id-pergunta').value || "[Não informada]";
            const metodoSelect = document.getElementById('id-metodo');
            const nomeMetodo = metodoSelect.options[metodoSelect.selectedIndex].text;

            let prompt = `Analise a seguinte consulta oracular estruturada. Para decodificar a dinâmica das posições e as regras específicas desta tiragem, consulte o seu documento interno de referência de MÉTODOS.\n\n`;
            prompt += `[DADOS DA CONSULTA]\n`;
            prompt += `* Pergunta formulada: "${pergunta}"\n`;
            prompt += `* Método estrutural: ${nomeMetodo}\n\n`;
            prompt += `[CARTAS EXTRAÍDAS E POSIÇÕES]\n`;

            listaPosicoesAtuais.forEach((posicao, index) => {
                const carta = cartasSelecionadas[index] || "[Pendente]";
                prompt += `  - ${posicao} -> ${carta}\n`;
            });

            prompt += `\n[INSTRUÇÕES RIGOROSAS PARA O PROMPT]\n`;
            prompt += `1. Acesse sua fonte de métodos e localize as regras e a semântica exata para o método.\n`;
            prompt += `2. Aplique o significado técnico de cada carta de acordo com os manuais de baralho em anexo, adaptando-os à função de cada posição determinada.\n`;
            prompt += `3. Costure uma resposta direta, clara e preditiva/analítica para a pergunta do consulente, respeitando estritamente os fatos textuais das fontes.`;

            document.getElementById('output-prompt').value = prompt;
        }

        function copiarPrompt() {
            const areaTexto = document.getElementById('output-prompt');
            areaTexto.select();
            navigator.clipboard.writeText(areaTexto.value).then(() => {
                const toast = document.getElementById("toast");
                toast.className = "toast show";
                setTimeout(() => { toast.className = toast.className.replace("show", ""); }, 3000);
            });
        }

        window.onload = init;
    </script>
</body>
</html>
